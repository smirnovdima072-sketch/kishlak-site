<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc">
  <title id="title">Архивный портрет Максима Фисенко (Кишлак)</title>
  <desc id="desc">Стилизованный чёрно-белый портрет в эстетике ксерокопии и уличного зина: чёрные белки глаз, татуировки, красный штамп АПФС.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    </filter>
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#0b0b0b"/>
    </pattern>
    <pattern id="stripe" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#0b0b0b" stroke-width="1"/>
    </pattern>
    <clipPath id="headclip">
      <ellipse cx="300" cy="345" rx="132" ry="172"/>
    </clipPath>
  </defs>

  <rect width="600" height="760" fill="#e6e0d2"/>
  <rect width="600" height="760" filter="url(#grain)" opacity=".55"/>

  <!-- red archive circle + crosshairs -->
  <ellipse cx="300" cy="350" rx="228" ry="262" fill="none" stroke="#ff2b17" stroke-width="2.5" stroke-dasharray="10 7"/>
  <path d="M300 62v24M300 620v24M40 350h24M536 350h24" stroke="#0b0b0b" stroke-width="1.5"/>
  <circle cx="300" cy="350" r="288" fill="none" stroke="rgba(11,11,11,.18)" stroke-width="1"/>

  <!-- shoulders / jacket -->
  <path d="M64 760C82 632 162 566 300 540c138 26 218 92 236 220Z" fill="#121211"/>
  <path d="M226 760l74-154 74 154" fill="none" stroke="#3a3934" stroke-width="2"/>
  <path d="M300 606v154" stroke="#3a3934" stroke-width="2"/>

  <!-- neck -->
  <path d="M248 468v96c0 26 104 26 104 0v-96Z" fill="#bdb39e"/>
  <path d="M248 500c34 18 70 18 104 0" fill="none" stroke="#8c8270" stroke-width="2"/>

  <!-- ears -->
  <ellipse cx="168" cy="352" rx="19" ry="36" fill="#cdc4b1" stroke="#0b0b0b" stroke-width="3"/>
  <ellipse cx="432" cy="352" rx="19" ry="36" fill="#cdc4b1" stroke="#0b0b0b" stroke-width="3"/>

  <!-- head -->
  <ellipse cx="300" cy="345" rx="132" ry="172" fill="#cdc4b1" stroke="#0b0b0b" stroke-width="3.5"/>

  <!-- cheek shading -->
  <path d="M186 360c8 74 44 128 114 146-62-6-98-58-114-146Z" fill="#b6ac97" opacity=".7"/>
  <path d="M414 360c-8 74-44 128-114 146 62-6 98-58 114-146Z" fill="#b6ac97" opacity=".7"/>

  <!-- hair -->
  <path d="M158 346c-12-135 54-214 142-214s154 79 142 214c-6-70-40-108-142-108S164 276 158 346Z" fill="#0b0b0b"/>
  <path d="M164 300c-18 78-10 150 18 206l22-20c-22-52-26-118-12-174Z" fill="#0b0b0b"/>
  <path d="M436 300c18 78 10 150-18 206l-22-20c22-52 26-118 12-174Z" fill="#0b0b0b"/>
  <path d="M214 186c24-28 52-42 86-42s62 14 86 42c-34-16-60-22-86-22s-52 6-86 22Z" fill="#2a2a27"/>

  <!-- eyebrows -->
  <path d="M210 328c18-14 44-16 64-4" fill="none" stroke="#0b0b0b" stroke-width="7" stroke-linecap="round"/>
  <path d="M326 324c20-12 46-10 64 4" fill="none" stroke="#0b0b0b" stroke-width="7" stroke-linecap="round"/>

  <!-- black sclera eyes -->
  <ellipse cx="252" cy="357" rx="27" ry="16" fill="#050505"/>
  <ellipse cx="348" cy="357" rx="27" ry="16" fill="#050505"/>
  <circle cx="260" cy="353" r="3.6" fill="#e9e4d8"/>
  <circle cx="356" cy="353" r="3.6" fill="#e9e4d8"/>
  <path d="M224 357c18-10 38-10 56 0M320 357c18-10 38-10 56 0" fill="none" stroke="#0b0b0b" stroke-width="2"/>

  <!-- nose -->
  <path d="M300 366l-9 52c4 8 14 8 18 0" fill="none" stroke="#7c7362" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- mouth -->
  <path d="M264 452c24-8 48-8 72 0-20 16-52 16-72 0Z" fill="#7d2a20"/>
  <path d="M264 452c24 7 48 7 72 0" fill="none" stroke="#0b0b0b" stroke-width="2.5"/>

  <!-- tattoos -->
  <g stroke="#0b0b0b" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M214 414l14 22M228 414l-14 22"/>
    <path d="M383 400c10 6 13 18 7 27-4 6-11 6-14 1"/>
    <path d="M390 446l10 10M400 446l-10 10"/>
    <path d="M250 500c14 10 32 10 46 0"/>
  </g>
  <text x="300" y="532" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" letter-spacing="3" fill="#5c5548">НЕ СПАТЬ</text>

  <!-- halftone on face -->
  <ellipse cx="300" cy="345" rx="132" ry="172" fill="url(#halftone)" opacity=".16" clip-path="url(#headclip)"/>

  <!-- stubble -->
  <g fill="#4a463c" opacity=".55">
    <circle cx="270" cy="476" r="1.4"/><circle cx="282" cy="486" r="1.2"/><circle cx="296" cy="490" r="1.3"/>
    <circle cx="310" cy="489" r="1.2"/><circle cx="324" cy="484" r="1.4"/><circle cx="334" cy="474" r="1.1"/>
    <circle cx="252" cy="462" r="1.2"/><circle cx="348" cy="462" r="1.2"/>
  </g>

  <!-- archive stamp -->
  <g transform="translate(402 620) rotate(-9)">
    <rect x="0" y="0" width="152" height="62" fill="none" stroke="#ff2b17" stroke-width="3"/>
    <text x="10" y="24" font-family="'Courier New',monospace" font-size="15" font-weight="bold" fill="#b31607">АПФС</text>
    <text x="10" y="43" font-family="'Courier New',monospace" font-size="10" fill="#b31607">2013—2020</text>
    <text x="10" y="55" font-family="'Courier New',monospace" font-size="7" fill="#b31607">АРХИВ / НЕ ОФИЦИАЛЬНО</text>
  </g>

  <!-- annotations -->
  <g font-family="'Courier New',monospace" fill="#0b0b0b">
    <text x="30" y="44" font-size="11" letter-spacing="2">СЕВЕРОМОРСК</text>
    <text x="30" y="60" font-size="8" letter-spacing="1" fill="#6f6a5f">69°04′ N · 33°25′ E</text>
    <text x="498" y="44" font-size="11" letter-spacing="2">АРХИВ 001</text>
    <text x="30" y="722" font-size="11" letter-spacing="2">МАКСИМ ФИСЕНКО</text>
    <text x="30" y="738" font-size="8" letter-spacing="1" fill="#6f6a5f">14.12.1998 · КИШЛАК</text>
    <text x="500" y="722" font-size="8" text-anchor="end" letter-spacing="1" fill="#6f6a5f">ФОТО: РЕКОНСТРУКЦИЯ</text>
  </g>

  <!-- tape -->
  <g opacity=".8">
    <rect x="10" y="10" width="108" height="26" fill="#d9cdaa" transform="rotate(-8 64 23)"/>
    <rect x="482" y="12" width="106" height="26" fill="#d9cdaa" transform="rotate(7 535 25)"/>
  </g>
</svg>
